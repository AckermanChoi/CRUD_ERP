{% extends "base.html" %}

{% block title %}Nueva Fabricación - ERP Toyota{% endblock %}
{% block page_title %}Nueva Fabricación{% endblock %}

{% block content %}
{% include "_form_styles.html" %}
<style>
    .preview-card {
        background: #f5f5f5;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 20px;
        margin-top: 20px;
        display: none;
    }
    .preview-card.visible {
        display: block;
    }
    .preview-card h3 {
        margin-top: 0;
        color: #333;
        font-size: 16px;
        font-weight: 600;
    }
    .preview-table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        border: 1px solid #ddd;
        border-radius: 6px;
        overflow: hidden;
        margin-top: 12px;
    }
    .preview-table thead {
        background: #f0f0f0;
        border-bottom: 2px solid #ddd;
    }
    .preview-table th {
        padding: 12px;
        text-align: left;
        font-weight: 600;
        color: #333;
        font-size: 13px;
    }
    .preview-table td {
        padding: 12px;
        border-bottom: 1px solid #eee;
        font-size: 13px;
        color: #333;
    }
    .preview-table tbody tr:last-child td {
        border-bottom: none;
    }
    .preview-table tr.error-row {
        background: #ffebee;
    }
    .preview-table tr.error-row td {
        color: #c62828;
    }
    .almacenes-list {
        list-style: none;
        padding: 0;
        margin: 0;
    }
    .almacenes-list li {
        padding: 4px 0;
        line-height: 1.4;
    }
    .almacen-item {
        color: #1976d2;
        font-weight: 500;
    }
    .almacen-error {
        color: #d32f2f;
        font-weight: 600;
        margin-top: 6px;
    }
    .loading {
        text-align: center;
        color: #999;
        padding: 20px;
        font-style: italic;
    }
</style>

<div class="form-card">
    <div class="form-card-header">
        <h2>🏗️ Nueva Orden de Fabricación</h2>
    </div>

    <form method="POST" class="form-content">
        <div class="form-row">
            <div class="form-group">
                <label for="vehiculo_id">Vehículo a fabricar *</label>
                <select id="vehiculo_id" name="vehiculo_id" required>
                    <option value="">Selecciona vehículo</option>
                    {% for v in vehiculos %}
                    <option value="{{ v.id }}" {% if cabecera and cabecera.vehiculo_id|string == v.id|string %}selected{% endif %}>
                        {{ v.modelo }} ({{ v.tipo }}, {{ v.anio }})
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="cantidad">Cantidad *</label>
                <input type="number" id="cantidad" name="cantidad" step="1" min="1" value="{{ cabecera.cantidad if cabecera else '' }}" required>
            </div>
        </div>

        <div class="form-group">
            <label for="almacen_destino_id">Almacén destino (solo vehículos) *</label>
            <select id="almacen_destino_id" name="almacen_destino_id" required>
                <option value="">Selecciona almacén destino</option>
                {% for a in almacenes_destino %}
                <option value="{{ a.id }}" {% if cabecera and cabecera.almacen_destino_id|string == a.id|string %}selected{% endif %}>
                    {{ a.ubicacion }} (capacidad libre: {{ a.disponible }})
                </option>
                {% endfor %}
            </select>
        </div>

        <!-- Preview de materiales -->
        <div id="preview-container" class="preview-card">
            <h3>📦 Materiales necesarios:</h3>
            <div id="preview-content"></div>
        </div>

        <div class="form-group">
            <label for="observaciones">Observaciones</label>
            <textarea id="observaciones" name="observaciones" rows="3">{{ cabecera.observaciones if cabecera else '' }}</textarea>
        </div>

        <div class="form-actions">
            <a href="/fabricacion" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary">Confirmar fabricación</button>
        </div>
    </form>
</div>

<script>
    const vehiculoSelect = document.getElementById('vehiculo_id');
    const cantidadInput = document.getElementById('cantidad');
    const previewContainer = document.getElementById('preview-container');
    const previewContent = document.getElementById('preview-content');

    async function fetchPreview() {
        const vehiculoId = vehiculoSelect.value;
        const cantidad = cantidadInput.value;

        if (!vehiculoId || !cantidad || cantidad === '0') {
            previewContainer.classList.remove('visible');
            return;
        }

        previewContent.innerHTML = '<div class="loading">Cargando materiales...</div>';
        previewContainer.classList.add('visible');

        try {
            const response = await fetch('/api/fabricacion/preview', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    vehiculo_id: vehiculoId,
                    cantidad: cantidad
                })
            });

            const data = await response.json();

            if (!response.ok) {
                previewContent.innerHTML = `<div style="color: #d32f2f; padding: 12px; background: #ffebee; border-radius: 4px;">⚠️ ${data.error || 'Error al cargar materiales'}</div>`;
                return;
            }

            if (data.materiales && data.materiales.length > 0) {
                let html = `
                    <table class="preview-table">
                        <thead>
                            <tr>
                                <th>Artículo</th>
                                <th style="width: 120px; text-align: center;">Cantidad</th>
                                <th>Almacenes de Origen</th>
                                <th style="width: 100px; text-align: center;">Acción</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                
                data.materiales.forEach(material => {
                    const hasError = material.pendiente > 0;
                    const rowClass = hasError ? 'error-row' : '';
                    
                    let almacenesHtml = '';
                    if (material.almacenes.length > 0) {
                        almacenesHtml = '<ul class="almacenes-list">';
                        material.almacenes.forEach(source => {
                            almacenesHtml += `<li><span class="almacen-item">${source.almacen}:</span> ${source.cantidad} un.</li>`;
                        });
                        almacenesHtml += '</ul>';
                    }
                    
                    let accionHtml = '';
                    if (hasError) {
                        almacenesHtml += `<div class="almacen-error">❌ Falta: ${material.pendiente} unidades</div>`;
                        accionHtml = `<a href="/compras/nuevo?articulo_id=${material.articulo_id}&cantidad=${material.pendiente}" class="btn btn-sm btn-warning" style="font-size: 12px; padding: 6px 8px;">Comprar</a>`;
                    }
                    
                    html += `
                        <tr class="${rowClass}">
                            <td><strong>${material.articulo}</strong></td>
                            <td style="text-align: center;"><strong>${material.cantidad_total}</strong></td>
                            <td>${almacenesHtml}</td>
                            <td style="text-align: center;">${accionHtml}</td>
                        </tr>
                    `;
                });
                
                html += `
                        </tbody>
                    </table>
                `;
                previewContent.innerHTML = html;
            } else {
                previewContent.innerHTML = '<div style="color: #999; padding: 12px;">No hay materiales requeridos</div>';
            }
        } catch (error) {
            previewContent.innerHTML = `<div style="color: #d32f2f; padding: 12px; background: #ffebee; border-radius: 4px;">Error: ${error.message}</div>`;
        }
    }

    vehiculoSelect.addEventListener('change', fetchPreview);
    cantidadInput.addEventListener('input', fetchPreview);

    // Cargar preview inicial si hay valores
    if (vehiculoSelect.value && cantidadInput.value) {
        fetchPreview();
    }
</script>
{% endblock %}
